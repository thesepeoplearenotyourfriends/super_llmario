<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLMario Reference-Pack Engine</title>
<style>
:root{color-scheme:dark;--ink:#eefcff;--muted:#a8c7d1;--panel:#102b3a;--edge:#48d7e8;--bad:#ff9b91;--good:#8ff0bd}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#244d69,#07131d 70%);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
main{width:min(900px,calc(100% - 28px));border:2px solid var(--edge);border-radius:22px;overflow:hidden;background:#071923;box-shadow:0 24px 70px #0009}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0d2635;border-bottom:1px solid #48d7e866}header strong{letter-spacing:.05em}header span{margin-left:auto;color:var(--muted);font-size:12px}
#stage{position:relative;aspect-ratio:16/8;min-height:280px}canvas{width:100%;height:100%;display:block;background:#081722}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;pointer-events:none}#empty div{max-width:500px;padding:24px;border:1px solid #4bd8e877;border-radius:18px;background:#0b2231e8}#empty strong{display:block;font-size:24px;color:#ffe477;margin-bottom:8px}#empty p{color:var(--muted);margin:6px 0}
.controls{display:flex;gap:9px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid #48d7e844;background:var(--panel)}button{border:1px solid #55dbe9;border-radius:10px;padding:8px 12px;background:#17465b;color:var(--ink);font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #ffe477}input{display:none}
#diagnostics{padding:10px 16px;min-height:42px;background:#091c27;color:var(--muted)}#diagnostics.bad{color:var(--bad)}#diagnostics.good{color:var(--good)}
</style>
</head>
<body>
<main>
  <header><strong>REFERENCE-PACK ENGINE</strong><span>runtime compiler foundation</span></header>
  <section id="stage">
    <canvas id="screen" width="960" height="480" aria-label="Reference engine viewport"></canvas>
    <div id="empty"><div><strong>Reference theme/map required</strong><p>Load the current reference theme and its compatible editor map.</p><p>Gameplay compilation is deliberately deferred.</p></div></div>
  </section>
  <div class="controls">
    <button id="themeButton">Load reference theme…</button>
    <button id="mapButton">Load editor map…</button>
    <input id="themeFile" type="file" accept=".llmtheme.txt,.txt,.json">
    <input id="mapFile" type="file" accept=".llmmap.txt,.txt,.json">
  </div>
  <div id="diagnostics" role="status" aria-live="polite">Waiting for a compatible reference theme and editor map.</div>
</main>

<script id="referencePackBoundary">
(function(root){
'use strict';
const REFERENCE_THEME_FORMAT='llmario-theme-pack-reference';
const REFERENCE_THEME_VERSION=1;
const REFERENCE_MAP_FORMAT='llmario-reference-editor-map';
const REFERENCE_MAP_VERSION=1;
const objectRecord=value=>!!value&&typeof value==='object'&&!Array.isArray(value);

function validateReferenceTheme(theme){
  const errors=[];
  if(!objectRecord(theme))return['theme root must be an object'];
  if(theme.format!==REFERENCE_THEME_FORMAT)errors.push(`unsupported theme format ${String(theme.format)}; expected ${REFERENCE_THEME_FORMAT}`);
  if(theme.packVersion!==REFERENCE_THEME_VERSION)errors.push(`unsupported theme packVersion ${String(theme.packVersion)}; expected ${REFERENCE_THEME_VERSION}`);
  if(typeof theme.id!=='string'||!theme.id.trim())errors.push('theme id must be a non-empty string');
  for(const field of ['atlases','resources','animations','constructions','objects','parameterSchemas','placeables'])if(!objectRecord(theme[field]))errors.push(`theme ${field} must be an object`);
  if(!Array.isArray(theme.sceneLayers)||!theme.sceneLayers.length)errors.push('theme sceneLayers must be a non-empty array');
  return errors;
}

function validateReferenceEditorMap(map,theme){
  const errors=[];
  if(!objectRecord(map))return['map root must be an object'];
  if(map.format!==REFERENCE_MAP_FORMAT)errors.push(`unsupported map format ${String(map.format)}; expected ${REFERENCE_MAP_FORMAT}`);
  if(map.mapVersion!==REFERENCE_MAP_VERSION)errors.push(`unsupported map mapVersion ${String(map.mapVersion)}; expected ${REFERENCE_MAP_VERSION}`);
  if(!objectRecord(map.theme))errors.push('map theme identity must be an object');
  if(!Array.isArray(map.instances))errors.push('map instances must be an array');
  if(theme&&map.theme?.id!==theme.id)errors.push(`theme mismatch: map requires ${String(map.theme?.id)} but loaded theme is ${theme.id}`);
  if(theme&&map.theme?.packVersion!==theme.packVersion)errors.push(`theme version mismatch: map requires pack ${String(map.theme?.packVersion)} but loaded theme is pack ${theme.packVersion}`);
  if(theme&&Array.isArray(map.instances))map.instances.forEach((instance,index)=>{
    if(!objectRecord(instance)||typeof instance.placeable!=='string'||!theme.placeables?.[instance.placeable])errors.push(`instance ${index} references an unknown placeable`);
    if(!objectRecord(instance?.values)||!Number.isFinite(instance.values['transform.x'])||!Number.isFinite(instance.values['transform.y']))errors.push(`instance ${index} has malformed values`);
  });
  return errors;
}

function validateReferencePair(theme,map){
  return [...validateReferenceTheme(theme),...validateReferenceEditorMap(map,theme)];
}

function parseReferenceDocument(text,label='document'){
  try{return{document:JSON.parse(text),errors:[]}}catch(error){return{document:null,errors:[`${label} is not valid JSON: ${error.message}`]}}
}

function prepareReferenceRuntime(theme,map){
  const errors=validateReferencePair(theme,map);
  if(errors.length)return{ok:false,errors,runtime:null};
  return{ok:true,errors:[],runtime:{status:'compiler-deferred',themeId:theme.id,packVersion:theme.packVersion,instanceCount:map.instances.length}};
}

root.ReferencePackBoundary={REFERENCE_THEME_FORMAT,REFERENCE_THEME_VERSION,REFERENCE_MAP_FORMAT,REFERENCE_MAP_VERSION,validateReferenceTheme,validateReferenceEditorMap,validateReferencePair,parseReferenceDocument,prepareReferenceRuntime};
})(typeof window==='object'?window:globalThis);
</script>
<script>
(() => {
'use strict';
const boundary=window.ReferencePackBoundary;
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),diagnostics=document.getElementById('diagnostics'),empty=document.getElementById('empty');
const state={theme:null,map:null,runtime:null,camera:{x:0,y:0,zoom:1},input:new Set(),lastTime:0};
function report(messages,kind='bad'){const list=Array.isArray(messages)?messages:[messages];diagnostics.textContent=list.join(' · ');diagnostics.className=kind}
function drawWaiting(time=0){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,'#15394e');gradient.addColorStop(1,'#07141e');ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.12;ctx.fillStyle='#83ecf4';for(let x=-32;x<w+32;x+=48){const y=h*.74+Math.sin(x*.018+time*.0003)*7;ctx.fillRect(x,y,32,h-y)}ctx.globalAlpha=1}
function frame(time){const dt=Math.min(.05,Math.max(0,(time-state.lastTime)/1000||0));state.lastTime=time;if(state.input.has('ArrowLeft')||state.input.has('KeyA'))state.camera.x-=180*dt;if(state.input.has('ArrowRight')||state.input.has('KeyD'))state.camera.x+=180*dt;drawWaiting(time);requestAnimationFrame(frame)}
function refreshPair(){
  state.runtime=null;empty.hidden=false;
  if(!state.theme||!state.map){report(`Waiting for ${state.theme?'a compatible editor map':'a compatible reference theme'}; no level is loaded.`,'');return}
  const result=boundary.prepareReferenceRuntime(state.theme,state.map);
  if(!result.ok){report(result.errors);return}
  state.runtime=result.runtime;empty.querySelector('strong').textContent='Compatible pair validated';empty.querySelectorAll('p')[0].textContent=`${result.runtime.themeId} · ${result.runtime.instanceCount} authored instances`;empty.querySelectorAll('p')[1].textContent='Reference runtime compiler integration is intentionally deferred.';report('Reference theme and editor map validated. Runtime compiler handoff is ready.','good')
}
async function loadFile(file,kind){
  const parsed=boundary.parseReferenceDocument(await file.text(),kind);
  if(parsed.errors.length){state[kind]=null;state.runtime=null;empty.hidden=false;report(parsed.errors);return}
  const errors=kind==='theme'?boundary.validateReferenceTheme(parsed.document):boundary.validateReferenceEditorMap(parsed.document,state.theme);
  if(errors.length){state[kind]=null;state.runtime=null;empty.hidden=false;report(errors);return}
  state[kind]=parsed.document;refreshPair()
}
for(const kind of ['theme','map']){const input=document.getElementById(`${kind}File`);document.getElementById(`${kind}Button`).onclick=()=>input.click();input.onchange=()=>{if(input.files[0])loadFile(input.files[0],kind);input.value=''}}
addEventListener('keydown',event=>state.input.add(event.code));addEventListener('keyup',event=>state.input.delete(event.code));addEventListener('blur',()=>state.input.clear());addEventListener('gamepadconnected',()=>report('Gamepad connected; reference content is still required.',''));
refreshPair();requestAnimationFrame(frame);
window.ReferenceEngine={state,loadReferenceTheme:document=>{const errors=boundary.validateReferenceTheme(document);if(errors.length){state.theme=null;state.runtime=null;report(errors);return errors}state.theme=document;refreshPair();return[]},loadReferenceEditorMap:document=>{const errors=boundary.validateReferenceEditorMap(document,state.theme);if(errors.length){state.map=null;state.runtime=null;report(errors);return errors}state.map=document;refreshPair();return[]},validateAndPrepare:boundary.prepareReferenceRuntime};
})();
</script>
</body>
</html>
