name: Restore raccoon feather theme definitions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore_feather.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore feather entries without touching corrected player atlas
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('themes/theme_marioai_reference_pack.llmtheme.txt')
          theme = json.loads(path.read_text(encoding='utf-8'))

          theme['atlases']['pickup.flight'] = {
              'mediaType': 'image/png',
              'encoding': 'base64',
              'data': '',
              'sha256': '992894ac071bba73cc506e3665f98a68e2b3fecbd31c9da9fc6c251f1ae2bfcb',
              'cellSize': {'w': 256, 'h': 256},
              'embeddedOnly': True,
          }

          theme['resources']['pickup.powerup.flight'] = {
              'kind': 'pickup',
              'role': 'pickup.powerup.flight',
              'purpose': 'Theme-backed feather flight powerup.',
              'belongsTo': 'pickup.powerup',
              'image': {'atlas': 'pickup.flight', 'rect': {'x': 0, 'y': 0, 'w': 256, 'h': 256}},
              'display': {'w': 16, 'h': 16, 'anchor': {'x': 0.5, 'y': 1}},
              'provenance': {'source': 'user-provided feather icon', 'atlas': 'pickup.flight'},
          }

          theme['objects']['raccoonFeather'] = {
              'defaultSceneLayer': 'actors',
              'kind': 'pickup',
              'engineNoun': 'pickup',
              'capabilities': ['collectible', 'flightPower'],
              'visuals': {'idle': 'pickup.powerup.flight'},
          }

          allowed = theme['parameterSchemas']['rewardBlock']['contents']['allowedObjects']
          if 'raccoonFeather' not in allowed:
              allowed.append('raccoonFeather')

          theme['placeables']['raccoonFeather'] = {
              'authoringGroup': 'World',
              'label': 'Raccoon Feather',
              'object': 'raccoonFeather',
              'parameters': ['transform.x', 'transform.y'],
          }

          # Guard the crouch correction that prompted this whole exercise.
          expected_carrying_sha = '26a2ec94d6d23922104f43eb5a34ae54268fe371b5b2620ce5f2d10fd445aa08'
          actual_carrying_sha = theme['atlases']['player.carrying']['sha256']
          if actual_carrying_sha != expected_carrying_sha:
              raise SystemExit(f'player.carrying atlas changed unexpectedly: {actual_carrying_sha}')

          path.write_text(json.dumps(theme, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit restored feather support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/theme_marioai_reference_pack.llmtheme.txt
          git diff --cached --quiet && exit 0
          git commit -m "Restore raccoon feather theme support"
          git push
