name: Build latest combo pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: super-llmario-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate release inputs
        run: |
          test -f engine/reference_pack_engine.html
          test -f editor/reference_pack_editor.html
          test -f themes/theme_marioai_reference_pack.llmtheme.txt
          test -f maps/demo.llmmap.txt

          python3 -m json.tool themes/theme_marioai_reference_pack.llmtheme.txt >/dev/null
          python3 -m json.tool maps/demo.llmmap.txt >/dev/null

      - name: Build combo pack
        run: |
          rm -rf dist
          mkdir -p dist/super_llmario

          cp engine/reference_pack_engine.html \
            dist/super_llmario/reference_pack_engine.html
          cp editor/reference_pack_editor.html \
            dist/super_llmario/reference_pack_editor.html
          cp themes/theme_marioai_reference_pack.llmtheme.txt \
            dist/super_llmario/theme_marioai_reference_pack.llmtheme.txt
          cp maps/demo.llmmap.txt \
            dist/super_llmario/demo.llmmap.txt

          cd dist
          zip -r super_llmario_latest.zip super_llmario

      - name: Replace rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true

          gh release create latest \
            dist/super_llmario_latest.zip \
            --target "$GITHUB_SHA" \
            --title "Super LLMario — Latest" \
            --notes "Latest combo pack: reference-pack engine, map editor, MarioAI reference theme, and demo map." \
            --latest
