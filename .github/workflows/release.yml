name: Build latest standalone HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: super-llmario-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build standalone release
        run: python3 scripts/build_release.py

      - name: Validate standalone release
        run: node --test tests/release_build.test.js

      - name: Replace rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true

          gh release create latest \
            dist/super_llmario.html \
            --target "$GITHUB_SHA" \
            --title "Super LLMario — Latest" \
            --notes "Single-file build with the current reference-pack engine, MarioAI reference theme, demo map, and embedded map editor." \
            --latest

      - name: Prepare Pages
        run: |
          mkdir -p dist/pages
          cp dist/super_llmario.html dist/pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
