name: Build latest standalone HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: super-llmario-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build standalone release
        run: python3 scripts/build_release.py

      - name: Validate standalone release
        run: node --test tests/release_build.test.js

      - name: Replace rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true

          gh release create latest \
            dist/super_llmario.html \
            --target "$GITHUB_SHA" \
            --title "Super LLMario — Latest" \
            --notes "Automatically built from the latest main branch." \
            --latest
